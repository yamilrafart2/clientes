# =============================================================================
# 1. CONFIGURACIÓN DE CONEXIÓN A LA BASE DE DATOS (SPRING DATA / JDBC) [Unidad 1]
# =============================================================================
# URL de conexión JDBC hacia PostgreSQL.
# Se conecta a 'localhost' en el puerto 5432 y busca la base de datos 'clientesdb'
# (la cual debe estar levantada en el contenedor de Docker Desktop).
spring.datasource.url=jdbc:postgresql://localhost:5432/clientesdb

# Driver Oficial de PostgreSQL para traducir los comandos JDBC.
spring.datasource.driver-class-name=org.postgresql.Driver

# Credenciales de acceso a la instancia de PostgreSQL.
spring.datasource.username=postgres
spring.datasource.password=postgres

# =============================================================================
# 2. CONFIGURACIÓN DE PERSISTENCIA CON JPA / HIBERNATE [Unidad 1]
# =============================================================================
# DDL AUTO (Estrategia de Generación de Esquema de la Base de Datos):
#
# Configuración actual para Desarrollo Local: 'update'
# - 'update': Hibernate inspecciona el metamodelo de las clases @Entity y actualiza
#   automáticamente la estructura de PostgreSQL (crea tablas o agrega columnas
#   faltantes sin borrar los datos existentes). Fue utilizado para inicializar
#   la tabla 'clientes' en el contenedor de Docker Desktop.
#
# Consideraciones de Arquitectura y Producción:
# - En entornos de desarrollo inicial permite levantar el backend rápidamente.
# - En entornos de producción (y en el Release Management con Flyway - Unidad 5)
#   se debe cambiar a 'validate' o 'none' para evitar modificaciones destructivas
#   automáticas en la BD y delegar el control de versiones DDL a scripts de migración.
spring.jpa.hibernate.ddl-auto=validate

# Imprime en la consola las sentencias SQL ejecutadas por Hibernate (útil para debuguear).
spring.jpa.show-sql=true

# Especifica el dialecto SQL propio de PostgreSQL para optimizar las consultas generadas.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# 3. CONFIGURACIÓN DE SPRING BATCH (PROCESAMIENTO EN LOTES) [Unidad 3]
# =============================================================================
# Desactiva la creación automática de las tablas del metamodelo de Spring Batch (BATCH_JOB_EXECUTION, etc.).
spring.batch.jdbc.initialize-schema=never

# Desactiva la ejecución automática de los Jobs de Spring Batch al iniciar la aplicación.
# Evita que corran procesos batch no deseados durante el arranque web.
spring.batch.job.enabled=false

# =============================================================================
# 4. CONFIGURACIÓN DE MIGRACIONES CON FLYWAY [Unidad 1 / Releases]
# =============================================================================
# CONTROL AUTOMÁTICO DE VERSIONES DE BASE DE DATOS (Flyway):
# - 'true': Activa el motor de Flyway en el arranque de Spring Boot.
# - Flyway busca y ejecuta automáticamente los scripts SQL (.sql) ubicados en
#   'src/main/resources/db/migration' siguiendo el orden de versión (V1__, V2__).
# - Registra las migraciones ejecutadas en la tabla 'flyway_schema_history'
#   en PostgreSQL ('clientesdb') para garantizar la trazabilidad e idempotencia.
#
# Consideraciones de Arquitectura:
# - Al activar Flyway, se debe ajustar Hibernate a 'spring.jpa.hibernate.ddl-auto=validate'
#   para que Flyway cree las tablas/datos y JPA solo verifique la coincidencia del modelo @Entity.
spring.flyway.enabled=true